name: Windows Release (ZIP)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / commit à builder"
        required: false
        default: "Harkipellago"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      # Configure (Visual Studio generator, x64)
      - name: Configure (Release)
        run: >
          cmake -S . -B build/x64
          -G "Visual Studio 17 2022"
          -A x64
          -T v143

      # Build Release
      - name: Build (Release)
        run: cmake --build build/x64 --config Release

      # Package ZIP with CPack (as in BUILDING.md Windows section)
      - name: Package (CPack ZIP)
        working-directory: build/x64
        run: cpack -G ZIP -C Release

      # Upload the ZIP artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shipwright-Windows-Release
          path: build/x64/*.zip